
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nothing123
      POSTGRES_DB: reservation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  gateway:
    build: ./backend/gateway
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - salle-service
      - reservation-service
    restart: no

  user-service:
    build: ./backend/user-service
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    restart: no

  salle-service:
    build: ./backend/salle-service
    ports:
      - "5002:5002"
    depends_on:
      db:
        condition: service_healthy
    restart: no

  reservation-service:
    build: ./backend/reservation-service
    ports:
      - "5003:5003"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: no

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    command: ["npm", "start"]
    restart: no

volumes:
  postgres_data: